<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
  <nav th:fragment="sidebar(active)" class="sidebar">
    <div class="brand">
      <span class="brand-mark">帳</span>
      <span class="brand-name">帳簿</span>
    </div>
    <ul class="nav-links">
      <li><a th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">ダッシュボード</a></li>
      <li><a th:href="@{/incomes}" th:classappend="${active == 'incomes'} ? 'active'">収入</a></li>
      <li><a th:href="@{/expenses}" th:classappend="${active == 'expenses'} ? 'active'">経費</a></li>
    </ul>
    <div class="sidebar-footer">
      <span class="user-name" sec:authentication="name"></span>
      <form method="post" th:action="@{/logout}">
        <button type="submit" class="link-button">ログアウト</button>
      </form>
    </div>
  </nav>
</body>
</html>
