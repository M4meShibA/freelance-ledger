<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>新規登録 | 帳簿</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">帳簿</div>
      <div class="auth-sub">新しいアカウントを作成する</div>

      <p class="flash-error" th:if="${error}" th:text="${error}"></p>

      <form method="post" th:action="@{/register}">
        <div class="form-group">
          <label for="username">ユーザー名</label>
          <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="password">パスワード</label>
          <input type="password" id="password" name="password" required minlength="8">
        </div>
        <button type="submit" class="btn" style="width:100%;">登録する</button>
      </form>

      <p class="auth-footer">
        すでにアカウントをお持ちの場合は <a th:href="@{/login}">ログイン</a>
      </p>
    </div>
  </div>
</body>
</html>
