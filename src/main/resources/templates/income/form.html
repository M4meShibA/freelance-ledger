<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>収入の記帳 | 帳簿</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div class="app-shell">
    <nav th:replace="~{fragments/nav :: sidebar(active='incomes')}"></nav>

    <main class="content">
      <div class="page-header">
        <h1 th:text="${form.id} != null ? '収入の編集' : '収入の記帳'"></h1>
        <a th:href="@{/incomes}">一覧に戻る</a>
      </div>

      <form class="form-card" method="post"
            th:action="${form.id} != null ? @{/incomes/{id}(id=${form.id})} : @{/incomes}"
            th:object="${form}">

        <div class="form-group">
          <label for="clientName">取引先名</label>
          <input type="text" id="clientName" th:field="*{clientName}">
          <p class="error-text" th:if="${#fields.hasErrors('clientName')}" th:errors="*{clientName}"></p>
        </div>

        <div class="form-group">
          <label for="description">内容</label>
          <input type="text" id="description" th:field="*{description}">
        </div>

        <div class="form-group">
          <label for="amount">金額(円)</label>
          <input type="number" id="amount" step="1" min="0" th:field="*{amount}">
          <p class="error-text" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></p>
        </div>

        <div class="form-group">
          <label for="receivedOn">入金日</label>
          <input type="date" id="receivedOn" th:field="*{receivedOn}">
          <p class="error-text" th:if="${#fields.hasErrors('receivedOn')}" th:errors="*{receivedOn}"></p>
        </div>

        <button type="submit" class="btn">保存する</button>
      </form>
    </main>
  </div>
</body>
</html>
