# --- Supabase(PostgreSQL)設定 ---
# SUPABASE_DB_URL は環境変数として渡す(パスワードをファイルに直書きしないため)。
# 値の例: jdbc:postgresql://aws-0-xxxx.pooler.supabase.com:5432/postgres?user=postgres.xxxx&password=xxxx&sslmode=require
# 入手方法: Supabaseダッシュボード > Connect > Session pooler > JDBC タブ
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.thymeleaf.cache=false

