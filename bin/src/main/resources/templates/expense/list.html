<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>経費 | 帳簿</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div class="app-shell">
    <nav th:replace="~{fragments/nav :: sidebar(active='expenses')}"></nav>

    <main class="content">
      <div class="page-header">
        <h1>経費</h1>
      </div>

      <div class="actions-bar">
        <a class="btn" th:href="@{/expenses/new}">経費を記帳する</a>
      </div>

      <table class="ledger">
        <thead>
          <tr>
            <th>支出日</th>
            <th>勘定科目</th>
            <th>内容</th>
            <th class="amount">金額</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="expense : ${expenses}">
            <td th:text="${expense.spentOn}"></td>
            <td th:text="${expense.category.name}"></td>
            <td th:text="${expense.description}"></td>
            <td class="amount amount-expense" th:text="${#numbers.formatDecimal(expense.amount, 0, 'COMMA', 0, 'POINT')} + ' 円'"></td>
            <td>
              <a class="btn-text" th:href="@{/expenses/{id}/edit(id=${expense.id})}">編集</a>
              <form class="inline" method="post" th:action="@{/expenses/{id}/delete(id=${expense.id})}"
                    onsubmit="return confirm('削除しますか?');">
                <button type="submit" class="btn-danger-text">削除</button>
              </form>
            </td>
          </tr>
          <tr class="empty-row" th:if="${#lists.isEmpty(expenses)}">
            <td colspan="5">まだ経費が記帳されていません。</td>
          </tr>
        </tbody>
      </table>
    </main>
  </div>
</body>
</html>
