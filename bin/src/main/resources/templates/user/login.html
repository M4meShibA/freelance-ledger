<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>ログイン | 帳簿</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">帳簿</div>
      <div class="auth-sub">個人事業主のための収入・経費管理</div>

      <p class="flash-success" th:if="${param.registered}">登録が完了しました。ログインしてください。</p>
      <p class="flash-error" th:if="${param.error}">ユーザー名またはパスワードが正しくありません。</p>
      <p class="flash-success" th:if="${param.logout}">ログアウトしました。</p>

      <form method="post" th:action="@{/login}">
        <div class="form-group">
          <label for="username">ユーザー名</label>
          <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
          <label for="password">パスワード</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn" style="width:100%;">ログイン</button>
      </form>

      <p class="auth-footer">
        アカウントをお持ちでない場合は <a th:href="@{/register}">こちらから登録</a>
      </p>
    </div>
  </div>
</body>
</html>
