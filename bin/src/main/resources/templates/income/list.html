<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>収入 | 帳簿</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div class="app-shell">
    <nav th:replace="~{fragments/nav :: sidebar(active='incomes')}"></nav>

    <main class="content">
      <div class="page-header">
        <h1>収入</h1>
      </div>

      <div class="actions-bar">
        <a class="btn" th:href="@{/incomes/new}">収入を記帳する</a>
      </div>

      <table class="ledger">
        <thead>
          <tr>
            <th>入金日</th>
            <th>取引先</th>
            <th>内容</th>
            <th class="amount">金額</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="income : ${incomes}">
            <td th:text="${income.receivedOn}"></td>
            <td th:text="${income.clientName}"></td>
            <td th:text="${income.description}"></td>
            <td class="amount amount-income" th:text="${#numbers.formatDecimal(income.amount, 0, 'COMMA', 0, 'POINT')} + ' 円'"></td>
            <td>
              <a class="btn-text" th:href="@{/incomes/{id}/edit(id=${income.id})}">編集</a>
              <form class="inline" method="post" th:action="@{/incomes/{id}/delete(id=${income.id})}"
                    onsubmit="return confirm('削除しますか?');">
                <button type="submit" class="btn-danger-text">削除</button>
              </form>
            </td>
          </tr>
          <tr class="empty-row" th:if="${#lists.isEmpty(incomes)}">
            <td colspan="5">まだ収入が記帳されていません。</td>
          </tr>
        </tbody>
      </table>
    </main>
  </div>
</body>
</html>
